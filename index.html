已經為你把 Google Drive 裡的 index_v6.html 整理成乾淨、無轉義符號、無亂碼、且修復了原檔中 { passive: 把 } 語法錯誤與結尾截斷問題的完整 HTML 程式碼。
你可以直接點擊下方程式碼區塊右上角的 「複製（Copy）」，貼入你的 index.html 中使用：
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MyTube" />
  <link rel="manifest" href="manifest.json" />
  <title>MyTube 離線影音庫</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-elevated: #f6f6f6;
      --bg-header: rgba(255, 255, 255, 0.94);
      --sheet-bg: #ffffff;
      --sheet-card: #f2f2f2;
      --text: #0f0f0f;
      --sub: #606060;
      --border: #eaeaea;
      --pill-bg: #f2f2f2;
      --pill-active-bg: #0f0f0f;
      --pill-active-text: #ffffff;
      --mini-bg: #f8f8f8;
      --red: #ff0000;
      --rust: #b83318;
    }
    [data-theme="dark"] {
      --bg: #0b0b0b;
      --bg-elevated: #181818;
      --bg-header: rgba(11, 11, 11, 0.94);
      --sheet-bg: #212121;
      --sheet-card: #2f2f2f;
      --text: #f5f5f5;
      --sub: #aaaaaa;
      --border: #2c2c2c;
      --pill-bg: #222222;
      --pill-active-bg: #ffffff;
      --pill-active-text: #0f0f0f;
      --mini-bg: #1c1c1c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 0 115px 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      transition: background 0.25s ease, color 0.25s ease;
    }
    #lockScreen {
      position: fixed; inset: 0; background: var(--bg); color: var(--text); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .lock-icon {
      width: 64px; height: 64px; border-radius: 50%; background: var(--pill-active-bg); color: var(--pill-active-text);
      display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px;
    }
    .pin-input {
      width: 190px; height: 50px; font-size: 24px; text-align: center; letter-spacing: 10px;
      background: var(--bg-elevated); color: var(--text);
      border: 1.5px solid var(--border); border-radius: 16px; margin: 10px 0; outline: none;
    }
    .pin-input:focus { border-color: var(--text); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 6px 16px; position: sticky; top: 0;
      background: var(--bg-header); backdrop-filter: blur(12px); z-index: 100;
    }
    .logo-wrap { display: flex; align-items: center; gap: 7px; }
    .yt-badge {
      background: var(--red); color: #fff; width: 28px; height: 20px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
    }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .nav-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      position: sticky; top: 44px; background: var(--bg-header); backdrop-filter: blur(12px); z-index: 99;
    }
    .tab-btn {
      flex: 1; text-align: center; padding: 10px 4px; font-size: 14px; font-weight: 600;
      color: var(--sub); border: none; background: transparent; position: relative; cursor: pointer;
    }
    .tab-btn.active { color: var(--text); font-weight: 800; }
    .tab-btn.active::after {
      content: ""; position: absolute; bottom: 0; left: 18%; right: 18%;
      height: 2.5px; background: var(--red); border-radius: 2px;
    }
    #bgTaskBanner {
      display: none;
      background: #1a2a1e;
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 16px;
      border-bottom: 1px solid rgba(110, 231, 183, 0.2);
      align-items: center;
      justify-content: space-between;
    }
    [data-theme="light"] #bgTaskBanner {
      background: #ecfdf5;
      color: #065f46;
      border-bottom: 1px solid #a7f3d0;
    }
    .container { padding: 14px 16px; }
    .pill-btn {
      border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .pill-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pill-primary { background: var(--pill-active-bg); color: var(--pill-active-text); border-color: var(--pill-active-bg); }
    .pill-ghost { background: var(--pill-bg); color: var(--text); border-color: transparent; }
    .pill-sm { padding: 5px 12px; font-size: 12px; }

    /* 播完行為設定條 */
    .play-mode-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 12px; margin-bottom: 14px; gap: 8px;
    }
    .play-mode-label { font-size: 12px; font-weight: 700; color: var(--sub); white-space: nowrap; }
    .play-mode-pills { display: flex; gap: 4px; }
    .mode-chip {
      border: 1px solid var(--border); background: var(--bg); color: var(--sub);
      border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .mode-chip.active {
      background: var(--pill-active-bg); color: var(--pill-active-text); border-color: var(--pill-active-bg);
    }

    /* MP3 列表樣式 */
    .song-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 4px; border-radius: 10px; margin-bottom: 4px; cursor: pointer;
      transition: background 0.15s ease;
    }
    .song-row:active, .song-row.playing { background: var(--bg-elevated); }
    .song-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; }
    .mp3-black-box {
      width: 50px; height: 50px; border-radius: 8px;
      background: #000000; color: #ffffff;
      border: 1px solid #2c2c2c;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; letter-spacing: 0.8px;
      flex-shrink: 0;
    }
    .song-info { overflow: hidden; flex: 1; }
    .song-title {
      font-size: 15px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .song-row.playing .song-title { color: #ff3b30; }
    .song-meta {
      font-size: 12px; color: var(--sub); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dots-btn {
      background: transparent; border: none; color: var(--text);
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .dots-btn:active { background: var(--pill-bg); }

    /* MP4 卡片 + 靜態首幀封面 + 畫面中心前5秒靜音預覽 */
    .media-card { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .media-thumb {
      width: 100%; aspect-ratio: 16/9; background: #141414; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; position: relative; overflow: hidden; cursor: pointer;
      border: 1px solid var(--border);
    }
    .media-thumb video {
      width: 100%; height: 100%; object-fit: cover; display: block; background: #141414;
    }
    .thumb-poster-overlay {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      pointer-events: none; transition: opacity 0.25s ease;
    }
    .preview-badge {
      position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700; color: #fff;
      background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(4px);
      display: none; align-items: center; gap: 4px; pointer-events: none;
    }
    .media-card.is-previewing .preview-badge { display: inline-flex; }
    .media-card.is-previewing { border-bottom-color: var(--red); }
    .play-center-hint {
      position: absolute; width: 46px; height: 46px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.62); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; pointer-events: none; backdrop-filter: blur(4px);
      transition: opacity 0.2s ease;
    }
    .media-card.is-playing-full .play-center-hint,
    .media-card.is-playing-full .preview-badge,
    .media-card.is-playing-full .thumb-poster-overlay {
      display: none !important;
    }
    .type-tag {
      position: absolute; bottom: 8px; right: 8px; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 700; color: #fff; pointer-events: none;
    }
    .tag-mp4 { background: rgba(15,15,15,0.85); }
    .media-row { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 10px; gap: 4px; }
    .media-title { font-size: 15px; font-weight: 700; line-height: 1.35; word-break: break-word; }
    .media-card.is-playing-full .media-title { color: #ff3b30; }
    .media-sub { font-size: 12px; color: var(--sub); margin-top: 3px; }

    /* 播放清單 */
    .pl-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; margin-bottom: 8px; cursor: pointer;
    }
    .pl-left { display: flex; align-items: center; gap: 14px; overflow: hidden; }
    .pl-cover {
      width: 112px; height: 64px; border-radius: 10px; background: #1e1e1e; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
      position: relative; flex-shrink: 0; border: 1px solid var(--border);
    }
    .pl-count {
      position: absolute; bottom: 5px; right: 7px; background: rgba(0,0,0,0.7);
      font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600;
    }

    /* 下載區與 MYTUBE 資料夾分類卡片 */
    .dl-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .avatar-circle {
      width: 54px; height: 54px; border-radius: 50%; background: var(--rust); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex-shrink: 0;
    }
    .folder-sync-card {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
    }
    .folder-tree-badge {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
      font-size: 11px; font-weight: 700;
    }
    .tree-pill {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 4px 9px; border-radius: 8px;
    }
    .url-box {
      width: 100%; height: 92px; border-radius: 18px; border: 1.5px solid var(--border);
      background: var(--bg-elevated); color: var(--text); padding: 12px 14px; font-size: 14px; resize: none; outline: none;
    }
    .url-box:focus { border-color: var(--text); }
    .hist-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 14px; margin-bottom: 8px; border: 1px solid var(--border);
      border-radius: 14px; background: var(--bg-elevated);
    }

    /* 底部迷你播放器（加大紅色進度條滑動熱區 + 圓點拖曳指標） */
    #miniPlayer {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
      background: var(--mini-bg); border-top: 1px solid var(--border);
      padding: 0 14px calc(10px + env(safe-area-inset-bottom)) 14px;
      z-index: 500; display: none;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.14);
    }
    .mini-scrub-zone {
      width: 100%;
      height: 26px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      margin-bottom: 2px;
    }
    .mini-progress-track {
      position: relative;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      transition: height 0.12s ease;
    }
    .mini-scrub-zone.scrubbing .mini-progress-track {
      height: 6px;
    }
    .mini-progress-bar {
      position: relative;
      height: 100%;
      width: 0%;
      background: var(--red);
      border-radius: 999px;
    }
    .mini-scrub-thumb {
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%) scale(1);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s ease;
    }
    .mini-scrub-zone.scrubbing .mini-scrub-thumb {
      transform: translateY(-50%) scale(1.38);
    }
    .mini-content { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .mini-left { display: flex; align-items: center; gap: 10px; overflow: hidden; flex: 1; }
    .mini-cover {
      width: 40px; height: 40px; border-radius: 6px; background: #000000; color: #ffffff;
      border: 1px solid #333; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0;
    }
    .mini-text { overflow: hidden; flex: 1; }
    .mini-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .mini-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ctrl-icon-btn {
      background: transparent; border: none; color: var(--text);
      font-size: 20px; width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .ctrl-icon-btn:active { background: var(--pill-bg); }

    /* === 仿 YouTube Music 底部滑出式選單 (Bottom Sheet) === */
    #ytSheetBackdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.58);
      z-index: 2000; display: none; align-items: flex-end; justify-content: center;
    }
    #ytSheetBackdrop.open { display: flex; }
    .yt-sheet-panel {
      width: 100%; max-width: 480px;
      background: var(--sheet-bg); color: var(--text);
      border-radius: 18px 18px 0 0;
      padding: 10px 16px calc(22px + env(safe-area-inset-bottom)) 16px;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.35);
      animation: sheetSlideUp 0.22s ease-out;
    }
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-drag-bar {
      width: 38px; height: 4px; border-radius: 2px;
      background: var(--sub); opacity: 0.35; margin: 0 auto 12px auto;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 12px; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .sheet-header-info { overflow: hidden; flex: 1; }
    .sheet-item-title {
      font-size: 16px; font-weight: 800; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sheet-item-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .sheet-close-btn {
      background: transparent; border: none; color: var(--text);
      font-size: 20px; width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .sheet-quick-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin: 14px 0;
    }
    .sheet-quick-card {
      background: var(--sheet-card); border: none; border-radius: 12px;
      padding: 14px 10px; color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 7px; cursor: pointer; font-size: 13px; font-weight: 700;
    }
    .sheet-quick-card:active { opacity: 0.78; }
    .sheet-quick-icon { font-size: 22px; line-height: 1; }
    .sheet-list-action {
      width: 100%; background: transparent; border: none; color: var(--text);
      padding: 13px 4px; display: flex; align-items: center; gap: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer; text-align: left;
    }
    .sheet-list-action:active { background: var(--sheet-card); border-radius: 10px; }

    .pl-picker-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 4px; cursor: pointer; border-radius: 10px;
    }
    .pl-picker-row:active { background: var(--sheet-card); }
    .pl-picker-left { display: flex; align-items: center; gap: 14px; overflow: hidden; flex: 1; }
    .pl-picker-thumb {
      width: 50px; height: 50px; border-radius: 8px;
      background: var(--sheet-card); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; flex-shrink: 0;
    }
    .pl-picker-thumb.liked-grad {
      background: linear-gradient(135deg, #3b82f6, #ec4899); color: #ffffff;
    }
    .pl-picker-name {
      font-size: 15px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pl-picker-count { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .pl-check-badge {
      font-size: 16px; font-weight: 800; color: #34c759; padding-left: 8px;
    }

    #ytToast {
      position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
      background: #1f1f1f; color: #ffffff; border: 1px solid #383838;
      padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
      z-index: 3000; display: none; white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-icon">🔒</div>
  <h2 id="lockTitle" style="margin:0; font-size:22px; font-weight:800;">MyTube 私人空間</h2>
  <p id="lockDesc" style="color:var(--sub); font-size:13px; text-align:center; margin:8px 0 4px 0;">請輸入 4 碼數字密碼解鎖</p>
  <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" />
  <input id="pinConfirm" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="再次確認" autocomplete="off" style="display:none;" />
  <button id="pinSubmitBtn" class="pill-btn pill-primary" style="width:200px; margin-top:8px;">解鎖進入</button>
  <p id="lockMsg" style="color:#ff3b30; font-size:13px; margin-top:10px; min-height:18px;"></p>
  <button id="resetPinBtn" style="display:none; margin-top:18px; background:none; border:none; color:var(--sub); font-size:12px; text-decoration:underline; cursor:pointer;" onclick="forgotOrResetPin()">忘記密碼？重設此裝置密碼</button>
</div>

<div class="topbar">
  <div class="logo-wrap">
    <div class="yt-badge">▶</div>
    <div class="brand">MyTube</div>
  </div>
  <div style="display:flex; gap:6px; align-items:center;">
    <button id="themeToggleBtn" class="pill-btn pill-ghost pill-sm" onclick="cycleTheme()">🌓 自動</button>
    <button class="pill-btn pill-ghost pill-sm" onclick="lockApp()">🔒</button>
  </div>
</div>

<!-- 僅保留 MP4、MP3、播放清單、下載四個分頁 -->
<div class="nav-tabs">
  <button class="tab-btn active" data-tab="MP4" onclick="switchTab('MP4')">MP4</button>
  <button class="tab-btn" data-tab="MP3" onclick="switchTab('MP3')">MP3</button>
  <button class="tab-btn" data-tab="PLAYLIST" onclick="switchTab('PLAYLIST')">播放清單</button>
  <button class="tab-btn" data-tab="DOWNLOAD" onclick="switchTab('DOWNLOAD')">下載</button>
</div>

<!-- 全域背景下載狀態列 -->
<div id="bgTaskBanner">
  <span id="bgTaskText">⏳ 背景下載進行中...</span>
  <span style="font-size:11px; opacity:0.85;">切換分頁不中斷</span>
</div>

<div id="mainContent" class="container"></div>

<input type="file" id="filePicker" accept="video/mp4,audio/mp3,audio/mpeg,audio/mp4,audio/x-m4a,.mp4,.mp3,.m4a" multiple style="display:none;" onchange="handleFileImport(event)" />

<!-- 底部迷你播放器（支援手指左右拖曳滑動紅色進度條與圓點指標） -->
<div id="miniPlayer">
  <div id="miniScrubZone" class="mini-scrub-zone">
    <div id="miniProgressTrack" class="mini-progress-track">
      <div id="miniProgressBar" class="mini-progress-bar">
        <div class="mini-scrub-thumb"></div>
      </div>
    </div>
  </div>
  <div class="mini-content">
    <div class="mini-left">
      <div class="mini-cover">MP3</div>
      <div class="mini-text">
        <div id="nowPlayingTitle" class="mini-title">未播放</div>
        <div id="nowPlayingTime" class="mini-sub">MyTube 離線音樂 · 背景播放中</div>
      </div>
    </div>

// === 2. 本機獨立儲存核心（每支手機完全獨立隔離） ===
const DB_NAME = 'MyTubeOfflineDB_V2';
const DB_VERSION = 1;
const PIN_STORAGE_KEY = 'mytube_device_pin_v2';
const META_STORAGE_KEY = 'mytube_device_meta_v2';
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('mediaFiles')) {
        database.createObjectStore('mediaFiles', { keyPath: 'id' });
      }
      if (!database.objectStoreNames.contains('meta')) {
        database.createObjectStore('meta', { keyPath: 'key' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function dbPut(storeName, value) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve();
  });
}

// === 3. 手機儲存空間 MYTUBE / MP3 & MYTUBE / MP4 自動分類資料夾寫入核心 ===
let mytubeRootDirHandle = null;
let mytubeFolderLabel = '';

async function choosePhoneMytubeFolder() {
  if (!('showDirectoryPicker' in window)) {
    showToast('此瀏覽器將自動於「下載項目 / 最近項目」建立 MYTUBE 分類檔');
    return;
  }
  try {
    const pickedHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    let rootHandle = pickedHandle;
    if (pickedHandle.name.toUpperCase() !== 'MYTUBE') {
      rootHandle = await pickedHandle.getDirectoryHandle('MYTUBE', { create: true });
    }
    await rootHandle.getDirectoryHandle('MP3', { create: true });
    await rootHandle.getDirectoryHandle('MP4', { create: true });
    mytubeRootDirHandle = rootHandle;
    mytubeFolderLabel = `已綁定實體資料夾：${pickedHandle.name} / MYTUBE / (MP3 & MP4)`;
    showToast('✓ 已建立 MYTUBE / MP3 與 MP4 資料夾！');
    if (currentTab === 'DOWNLOAD') renderCurrentView();
  } catch (e) {
    if (e.name !== 'AbortError') {
      showToast('已切換為自動下載至手機「最近項目」模式');
    }
  }
}

async function saveToPhoneFolderAndRecents(blob, cleanTitle, fmt) {
  const isMp4 = fmt.toUpperCase() === 'MP4';
  const subFolder = isMp4 ? 'MP4' : 'MP3';
  const ext = isMp4 ? '.mp4' : '.mp3';
  const safeBaseName = cleanTitle.replace(/[\\/:*?"<>|]/g, '_').trim() || `MyTube_${Date.now()}`;
  const rawFileName = `${safeBaseName}${ext}`;
  const recentFriendlyName = `[MYTUBE-${subFolder}] ${rawFileName}`;

  let wroteToRealDir = false;
  if (mytubeRootDirHandle) {
    try {
      const targetSubDir = await mytubeRootDirHandle.getDirectoryHandle(subFolder, { create: true });
      const fileHandle = await targetSubDir.getFileHandle(rawFileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      wroteToRealDir = true;
    } catch (e) {
      wroteToRealDir = false;
    }
  }

  triggerBrowserFileDownload(blob, recentFriendlyName);
  return { wroteToRealDir, subFolder, recentFriendlyName };
}

function triggerBrowserFileDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1800);
}

async function saveMeta() {

  if (db) {

}

async function loadSavedMeta() {
  let dbMeta = null;
  if (db) {
    const saved = await dbGet('meta', 'appMeta');
    if (saved && saved.data) dbMeta = saved.data;
  }
  let lsMeta = null;
  try {
    const raw = localStorage.getItem(META_STORAGE_KEY);
    if (raw) lsMeta = JSON.parse(raw);
  } catch (e) {}

  const merged = { ...appMeta, ...(lsMeta || {}), ...(dbMeta || {}) };
  const savedPin = (dbMeta && dbMeta.pin) || (lsMeta && lsMeta.pin) || localStorage.getItem(PIN_STORAGE_KEY);
  if (savedPin && /^\d{4}$/.test(savedPin)) {
    merged.pin = savedPin;
  }
  if (!['next', 'repeat', 'stop'].includes(merged.mp4EndBehavior)) merged.mp4EndBehavior = 'next';
  if (!['next', 'repeat', 'stop'].includes(merged.mp3EndBehavior)) merged.mp3EndBehavior = 'next';
  appMeta = merged;
  await saveMeta();
}

// === 5. 擷取影片首幀靜態封面 ===
function generateVideoPoster(blob) {
  return new Promise((resolve) => {
    const tempUrl = URL.createObjectURL(blob);
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'metadata';
    v.src = tempUrl;

    const cleanup = (dataUrl) => {
      URL.revokeObjectURL(tempUrl);
      resolve(dataUrl);
    };

    v.onloadeddata = () => {
      try {
        v.currentTime = Math.min(0.5, (v.duration || 1) * 0.1);
      } catch (e) {
        cleanup(null);
      }
    };

    v.onseeked = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = v.videoWidth || 480;
        canvas.height = v.videoHeight || 270;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
        cleanup(dataUrl);
      } catch (e) {
        cleanup(null);
      }
    };

    v.onerror = () => cleanup(null);
    setTimeout(() => cleanup(null), 4000);
  });
}

// === 6. 自動寫入本機資料庫與個人獨立清單 ===
async function storeMediaBlob(title, fmt, blob) {
  const isMp4 = fmt.toUpperCase() === 'MP4';
  const ext = isMp4 ? '.mp4' : '.mp3';
  let posterDataUrl = null;
  if (isMp4) {
    posterDataUrl = await generateVideoPoster(blob);
  }
  const fileRecord = {
    id: 'file_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    name: title,
    fullName: title + ext,
    type: isMp4 ? 'MP4' : 'MP3',
    mime: blob.type || (isMp4 ? 'video/mp4' : 'audio/mpeg'),
    blob: blob,
    poster: posterDataUrl,
    addedAt: new Date().toLocaleDateString('zh-TW')
  };
  await dbPut('mediaFiles', fileRecord);
  if (!appMeta.playlists[0].fileIds.includes(fileRecord.id)) {
    appMeta.playlists[0].fileIds.unshift(fileRecord.id);
  }
  await saveMeta();
  return fileRecord;
}

async function handleFileImport(event) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  for (const file of files) {
    const isMp4 = file.name.toLowerCase().endsWith('.mp4') || file.type.includes('video');
    const cleanName = file.name.replace(/^\[MYTUBE-(MP3|MP4)\]\s*/i, '').replace(/\.[^/.]+$/, "");
    await storeMediaBlob(cleanName, isMp4 ? 'MP4' : 'MP3', file);
  }
  event.target.value = '';
  renderCurrentView();
}

// === 7. MP3 音訊背景連播、即時手指滑動進度條、重複與停止控制 ===
const audioPlayer = document.getElementById('bgAudioPlayer');
let isScrubbingAudio = false;

function formatSec(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function updateMiniProgressUI(currentTime, duration, isDragging = false) {
  const bar = document.getElementById('miniProgressBar');
  const timeText = document.getElementById('nowPlayingTime');
  if (!bar || !timeText || !duration) return;
  const pct = Math.max(0, Math.min(100, (currentTime / duration) * 100));
  bar.style.width = `${pct}%`;
  const modeTag = isDragging
    ? '放開定位'
    : (appMeta.mp3EndBehavior === 'repeat' ? '單曲重複' : (appMeta.mp3EndBehavior === 'stop' ? '播完停止' : '自動連播'));
  timeText.textContent = `${formatSec(currentTime)} / ${formatSec(duration)} · ${modeTag}`;
}

audioPlayer.addEventListener('timeupdate', () => {
  if (isScrubbingAudio) return;
  if (audioPlayer.duration) {
    updateMiniProgressUI(audioPlayer.currentTime, audioPlayer.duration, false);
  }
});

audioPlayer.addEventListener('play', () => {
  document.getElementById('playPauseBtn').textContent = '⏸';
});

audioPlayer.addEventListener('pause', () => {
  document.getElementById('playPauseBtn').textContent = '▶';
});

audioPlayer.addEventListener('ended', () => {
  if (isScrubbingAudio) return;
  if (appMeta.mp3EndBehavior === 'repeat') {
    audioPlayer.currentTime = 0;
    audioPlayer.play();
  } else if (appMeta.mp3EndBehavior === 'stop') {
    document.getElementById('playPauseBtn').textContent = '▶';
  } else {
    playNextInQueue();
  }
});

function togglePlayPause() {
  if (audioPlayer.paused) { audioPlayer.play(); } else { audioPlayer.pause(); }
}

(function initScrubGesture() {
  const scrubZone = document.getElementById('miniScrubZone');
  const track = document.getElementById('miniProgressTrack');
  if (!scrubZone || !track) return;

  function calcTargetTime(clientX) {
    if (!audioPlayer.duration || !isFinite(audioPlayer.duration)) return null;
    const rect = track.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    return ratio * audioPlayer.duration;
  }

  function onStart(clientX) {
    const t = calcTargetTime(clientX);
    if (t === null) return;
    isScrubbingAudio = true;
    scrubZone.classList.add('scrubbing');
    updateMiniProgressUI(t, audioPlayer.duration, true);
  }

  function onMove(clientX) {
    if (!isScrubbingAudio) return;
    const t = calcTargetTime(clientX);
    if (t === null) return;
    updateMiniProgressUI(t, audioPlayer.duration, true);
  }

  function onEnd(clientX) {
    if (!isScrubbingAudio) return;
    const t = calcTargetTime(clientX);
    isScrubbingAudio = false;
    scrubZone.classList.remove('scrubbing');
    if (t !== null) {
      audioPlayer.currentTime = t;
      updateMiniProgressUI(t, audioPlayer.duration, false);
    }
  }

  scrubZone.addEventListener('touchstart', (e) => {
    if (e.touches.length) {
      e.preventDefault();
      onStart(e.touches[0].clientX);
    }
  }, { passive: false });

  scrubZone.addEventListener('touchmove', (e) => {
    if (isScrubbingAudio && e.touches.length) {
      e.preventDefault();
      onMove(e.touches[0].clientX);
    }
  }, { passive: false });

  scrubZone.addEventListener('touchend', (e) => {
    if (isScrubbingAudio) {
      const x = e.changedTouches && e.changedTouches.length ? e.changedTouches[0].clientX : 0;
      onEnd(x);
    }
  });

  scrubZone.addEventListener('touchcancel', () => {
    isScrubbingAudio = false;
    scrubZone.classList.remove('scrubbing');
  });

  scrubZone.addEventListener('mousedown', (e) => {
    e.preventDefault();
    onStart(e.clientX);
  });
  window.addEventListener('mousemove', (e) => {
    if (isScrubbingAudio) onMove(e.clientX);
  });
  window.addEventListener('mouseup', (e) => {
    if (isScrubbingAudio) onEnd(e.clientX);
  });
})();

async function playFileById(fileId, queueIds = null) {
  const record = await dbGet('mediaFiles', fileId);
  if (!record) return;

  currentPlayingId = fileId;
  if (queueIds) {
    playQueue = [...queueIds];
    currentQueueIndex = playQueue.indexOf(fileId);
  }

  const blobUrl = URL.createObjectURL(record.blob);
  const miniPlayer = document.getElementById('miniPlayer');
  miniPlayer.style.display = 'block';
  document.getElementById('nowPlayingTitle').textContent = record.name;

  audioPlayer.src = blobUrl;
  audioPlayer.play();

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: record.name,
      artist: 'MyTube 離線音樂庫',
      album: 'MP3 背景播放'
    });
    navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
    navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => playNextInQueue());
    navigator.mediaSession.setActionHandler('previoustrack', () => playPrevInQueue());
  }
  renderCurrentView();
}

function playNextInQueue() {
  if (!playQueue.length) return;
  currentQueueIndex = (currentQueueIndex + 1) % playQueue.length;
  playFileById(playQueue[currentQueueIndex]);
}

function playPrevInQueue() {
  if (!playQueue.length) return;
  currentQueueIndex = (currentQueueIndex - 1 + playQueue.length) % playQueue.length;
  playFileById(playQueue[currentQueueIndex]);
}

// === 8. MP4 焦點中心前 5 秒靜音預覽 + 完整播放 + 播完自動跳下一部/待播佇列 ===
function startCardFiveSecPreview(cardEl) {
  if (!cardEl || cardEl.classList.contains('is-playing-full')) return;
  const video = cardEl.querySelector('video');
  const posterImg = cardEl.querySelector('.thumb-poster-overlay');
  if (!video) return;

  document.querySelectorAll('.media-card.is-previewing').forEach(other => {
    if (other !== cardEl) stopCardFiveSecPreview(other);
  });

  cardEl.classList.add('is-previewing');
  video.muted = true;
  video.controls = false;
  if (posterImg) posterImg.style.opacity = '0';

  const onTimeUpdate = () => {
    if (!cardEl.classList.contains('is-previewing')) return;
    if (video.currentTime >= 5) {
      video.currentTime = 0;
    }
  };
  video._previewHandler = onTimeUpdate;
  video.addEventListener('timeupdate', onTimeUpdate);
  video.play().catch(() => {});
}

function stopCardFiveSecPreview(cardEl) {
  if (!cardEl || cardEl.classList.contains('is-playing-full')) return;
  const video = cardEl.querySelector('video');
  const posterImg = cardEl.querySelector('.thumb-poster-overlay');
  cardEl.classList.remove('is-previewing');
  if (video) {
    if (video._previewHandler) {
      video.removeEventListener('timeupdate', video._previewHandler);
      video._previewHandler = null;
    }
    video.pause();
    try { video.currentTime = 0.1; } catch (e) {}
  }
  if (posterImg) posterImg.style.opacity = '1';
}

function playFullMp4ById(fileId) {
  const targetCard = document.querySelector(`.media-card[data-id="${fileId}"]`);
  if (!targetCard) return;

  if (!audioPlayer.paused) audioPlayer.pause();

  document.querySelectorAll('.media-card').forEach(card => {
    const v = card.querySelector('video');
    const posterImg = card.querySelector('.thumb-poster-overlay');
    if (card !== targetCard) {
      card.classList.remove('is-previewing', 'is-playing-full');
      if (v) {
        if (v._previewHandler) {
          v.removeEventListener('timeupdate', v._previewHandler);
          v._previewHandler = null;
        }
        v.pause();
        v.controls = false;
        v.muted = true;
      }
      if (posterImg) posterImg.style.opacity = '1';
    }
  });

  activeFullVideoId = fileId;
  targetCard.classList.remove('is-previewing');
  targetCard.classList.add('is-playing-full');
  const video = targetCard.querySelector('video');
  if (video) {
    if (video._previewHandler) {
      video.removeEventListener('timeupdate', video._previewHandler);
      video._previewHandler = null;
    }
    video.currentTime = 0;
    video.muted = false;
    video.controls = true;
    video.play().catch(() => {});
  }
}

function handleMp4Ended(fileId) {
  const card = document.querySelector(`.media-card[data-id="${fileId}"]`);
  if (!card || !card.classList.contains('is-playing-full')) return;
  const video = card.querySelector('video');

  if (appMeta.mp4EndBehavior === 'repeat') {
    if (video) {
      video.currentTime = 0;
      video.play();
    }
  } else if (appMeta.mp4EndBehavior === 'stop') {
    // 停留在該部影片結束狀態
  } else {
    if (mp4UpNextQueue.length > 0) {
      const nextQueuedId = mp4UpNextQueue.shift();
      const nextCard = document.querySelector(`.media-card[data-id="${nextQueuedId}"]`);
      if (nextCard) {
        nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => playFullMp4ById(nextQueuedId), 350);
        return;
      }
    }
    const allCards = Array.from(document.querySelectorAll('.media-card'));
    const idx = allCards.indexOf(card);
    if (idx !== -1 && idx + 1 < allCards.length) {
      const nextCard = allCards[idx + 1];
      const nextId = nextCard.dataset.id;
      nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => playFullMp4ById(nextId), 350);
    }
  }
}

function setupMp4CenterFocusObserver() {
  if (mp4ScrollObserver) {
    mp4ScrollObserver.disconnect();
    mp4ScrollObserver = null;
  }
  const cards = document.querySelectorAll('.media-card');
  if (!cards.length) return;

  mp4ScrollObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const card = entry.target;
      if (card.classList.contains('is-playing-full')) return;
      if (entry.isIntersecting) {
        startCardFiveSecPreview(card);
      } else {
        stopCardFiveSecPreview(card);
      }
    });
  }, {
    root: null,
    rootMargin: '-32% 0px -32% 0px',
    threshold: 0.1
  });

  cards.forEach(c => mp4ScrollObserver.observe(c));
}

  document.getElementById('ytSheetBackdrop').classList.remove('open');

async function addTargetToUpNext() {
  if (!menuTargetFile) return;
  const file = menuTargetFile;

  if (file.type === 'MP3') {
    if (!playQueue.length) {
      closeItemMenu();
      playFileById(file.id, [file.id]);
      showToast(`▶ 開始播放「${file.name}」`);
      return;
    }
    const existingIdx = playQueue.indexOf(file.id);
    if (existingIdx !== -1 && existingIdx > currentQueueIndex) {
      playQueue.splice(existingIdx, 1);
    }
    const insertPos = Math.max(0, currentQueueIndex + 1);
    playQueue.splice(insertPos, 0, file.id);
    closeItemMenu();
    showToast(`✓ 已將「${file.name}」加入待播清單`);
  } else {
    mp4UpNextQueue = mp4UpNextQueue.filter(id => id !== file.id);
    mp4UpNextQueue.unshift(file.id);
    closeItemMenu();
    showToast(`✓ 已加入影片待播清單（下一部播放）`);
  }
}

async function toggleFileInPlaylist(plId) {

  const file = menuTargetFile;

  const idx = pl.fileIds.indexOf(file.id);

async function fetchFromPublicEngine(youtubeUrl, fmt) {
  const isAudio = fmt.toUpperCase() !== 'MP4';
  const payload = {
    url: youtubeUrl,
    downloadMode: isAudio ? 'audio' : 'auto',
    audioFormat: 'mp3',
    videoQuality: '1080'
  };

  let lastError = '解析節點忙碌中';
  for (const endpoint of PUBLIC_COBALT_NODES) {
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data && data.url) {
        const mediaRes = await fetch(data.url);
        if (!mediaRes.ok) throw new Error('串流讀取失敗');
        const blob = await mediaRes.blob();
        const rawFilename = data.filename ? data.filename.replace(/\.[^/.]+$/, '') : `YouTube_${fmt}_${Date.now()}`;
        return { title: rawFilename, blob };
      }
      if (data && data.error && data.error.code) {
        lastError = data.error.code;
      }
    } catch (e) {
      lastError = e.message;
    }
  }
  throw new Error(lastError);
}

function syncDownloadStatusUI(htmlText) {
  bgDownloadState.statusHtml = htmlText;
  if (currentTab === 'DOWNLOAD') {
    const statusEl = document.getElementById('dlStatus');
    if (statusEl) statusEl.innerHTML = htmlText;
  }
}

async function startBackgroundBatchDownload() {
  if (bgDownloadState.active) return;

  const urlEl = document.getElementById('dlUrls');
  const fmtEl = document.getElementById('dlFormat');
  const raw = (urlEl ? urlEl.value : bgDownloadState.draftUrls).trim();
  const fmt = fmtEl ? fmtEl.value : bgDownloadState.draftFormat;
  const urls = raw.split(/[\s,，]+/).filter(Boolean);

  if (!urls.length) {
    syncDownloadStatusUI('⚠️ 請先貼上至少一個 YouTube 網址');
    return;
  }

  bgDownloadState.active = true;
  bgDownloadState.bannerText = `⏳ 正在背景下載 1 / ${urls.length} 個檔案...`;
  updateBgBanner();

  const btnEl = document.getElementById('startDlBtn');
  if (btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = '⏳ 背景下載中...';
  }

  let successCount = 0;

  for (let i = 0; i < urls.length; i++) {
    const targetUrl = urls[i];
    bgDownloadState.bannerText = `⏳ 背景下載中 (${i + 1} / ${urls.length})...`;
    updateBgBanner();
    syncDownloadStatusUI(`⏳ 正在背景處理第 <b>${i + 1} / ${urls.length}</b> 個項目...<br><span style="color:var(--sub); font-size:12px;">（將自動存入手機 MYTUBE / ${fmt} 分類並顯示於最近項目）</span>`);

    try {
      const { title, blob } = await fetchFromPublicEngine(targetUrl, fmt);
      await storeMediaBlob(title, fmt, blob);

      if (appMeta.saveCopyToPhoneFiles) {
        await saveToPhoneFolderAndRecents(blob, title, fmt);
      }

      appMeta.history.push({
        title: `[MYTUBE-${fmt}] ${title}`,
        format: fmt,
        time: new Date().toLocaleString('zh-TW', { hour12: false })
      });
      await saveMeta();
      successCount++;

      if (currentTab === 'MP3' || currentTab === 'MP4') {
        renderCurrentView();
      }
    } catch (err) {
      syncDownloadStatusUI(bgDownloadState.statusHtml + `<br><span style="color:#ff3b30;">❌ 第 ${i + 1} 個無法直接抓取（${err.message}），可改用「+ 讀取歌曲 / + 讀取影片」匯入本機檔</span>`);
    }
  }

  bgDownloadState.active = false;
  updateBgBanner();

  if (successCount > 0) {
    bgDownloadState.draftUrls = '';
    syncDownloadStatusUI(`🎉 下載完成！已將 <b>${successCount}</b> 個檔案自動存入 App「${fmt}」分頁，並同步歸類至手機儲存空間「MYTUBE / ${fmt}」與「最近項目」！`);
  }

  if (currentTab === 'DOWNLOAD' || currentTab === 'MP3' || currentTab === 'MP4') {
    renderCurrentView();
  }
}

async function createNewPlaylist() {
  const name = prompt('請輸入新播放清單名稱（例如：開車音樂、運動歌單）：');
  if (!name || !name.trim()) return;
  appMeta.playlists.push({
    id: 'pl_' + Date.now(),
    name: name.trim(),
    icon: '🎵',
    fileIds: []
  });
  await saveMeta();
  renderCurrentView();
}

(async () => {
  await requestPersistentStorage();
  await initDB();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  await setupAuth();
})();
