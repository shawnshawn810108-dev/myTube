<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
  <title>MyTube</title>
  <!-- Mammoth.js for Word (.docx) parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- PDF.js for PDF parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-outer: #e5e7eb;
      --bg-primary: #ffffff;
      --bg-secondary: #f4f6f9;
      --bg-card: #ffffff;
      --bg-pill: #f1f3f5;
      --bg-pill-hover: #e5e8ec;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --border-color: #e5e7eb;
      --accent-red: #ff0000;
      --accent-red-soft: rgba(255, 0, 0, 0.12);
      --accent-blue: #2563eb;
      --accent-blue-soft: rgba(37, 99, 235, 0.12);
      --dock-bg: rgba(235, 243, 255, 0.88);
      --dock-border: rgba(255, 255, 255, 0.85);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.08);
      --shadow-dock: 0 8px 28px rgba(37, 99, 235, 0.15);
      --highlight-bg: rgba(255, 0, 0, 0.1);
      --app-max-w: 430px;
    }

    body.dark-mode {
      --bg-outer: #07080a;
      --bg-primary: #0f1115;
      --bg-secondary: #181b21;
      --bg-card: #1c2028;
      --bg-pill: #262b36;
      --bg-pill-hover: #323846;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --border-color: #2d3340;
      --accent-red: #ff2a2a;
      --accent-red-soft: rgba(255, 42, 42, 0.18);
      --accent-blue: #3b82f6;
      --accent-blue-soft: rgba(59, 130, 246, 0.18);
      --dock-bg: rgba(30, 36, 48, 0.88);
      --dock-border: rgba(255, 255, 255, 0.12);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-dock: 0 8px 32px rgba(0, 0, 0, 0.55);
      --highlight-bg: rgba(255, 42, 42, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: var(--bg-outer);
    }

    /* Unified Mobile-Sized Shell across iPhone, iPad, macOS, and Windows */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
      padding-bottom: 165px;
      min-height: 100vh;
      width: 100%;
      max-width: var(--app-max-w);
      margin: 0 auto;
      position: relative;
      overflow-x: hidden;
    }

    @media (min-width: 460px) {
      body {
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.14);
        border-left: 1px solid var(--border-color);
        border-right: 1px solid var(--border-color);
      }
    }

    /* PIN Lock Screen */
    #pin-screen {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--app-max-w);
      background: var(--bg-primary);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #pin-screen.hidden { display: none; }
    .pin-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .pin-dots {
      display: flex;
      gap: 14px;
      margin: 24px 0 32px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--text-secondary);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 16px;
    }
    .pin-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pin-btn:active { background: var(--bg-pill-hover); transform: scale(0.95); }

    /* Top Header with YouTube Auto-Hide Behavior */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      padding-top: env(safe-area-inset-top);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease, background-color 0.25s ease, border-color 0.25s ease;
      will-change: transform, opacity;
    }
    header.chrome-hidden {
      transform: translateY(-105%);
      opacity: 0;
      pointer-events: none;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      cursor: pointer;
    }
    .play-badge {
      background: var(--accent-red);
      color: #ffffff;
      width: 32px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-pill);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:active { transform: scale(0.92); }

    /* Search Bar */
    .search-drawer {
      display: none;
      padding: 0 16px 10px;
    }
    .search-drawer.open { display: block; }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
    }

    /* Main Tabs: 影片 | 音樂 | 電子書 */
    .tabs {
      display: flex;
      justify-content: space-around;
      padding: 0 12px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px 4px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .tab-btn.active {
      color: var(--text-primary);
      font-weight: 700;
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 18%;
      right: 18%;
      height: 3px;
      background: var(--text-primary);
      border-radius: 3px 3px 0 0;
    }

    /* Container & Folder Header */
    .container {
      padding: 14px 16px;
      width: 100%;
    }
    .folder-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }
    .action-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .pill-btn {
      white-space: nowrap;
      padding: 8px 13px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-pill);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .pill-btn:active { background: var(--bg-pill-hover); }
    .pill-btn-primary {
      background: var(--accent-red-soft);
      border-color: rgba(255, 0, 0, 0.28);
      color: var(--accent-red);
      font-weight: 700;
    }

    /* Import Progress Banner */
    .import-toast {
      display: none;
      background: var(--accent-blue-soft);
      border: 1px solid var(--accent-blue);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .import-toast.show { display: flex; }

    /* Media List Cards */
    .media-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .media-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }
    .media-card.playing {
      border-color: var(--accent-red);
      background: var(--accent-red-soft);
    }
    .media-thumb {
      width: 58px;
      height: 46px;
      border-radius: 10px;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .media-info {
      flex: 1;
      min-width: 0;
    }
    .media-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .media-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .card-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      padding: 5px;
      cursor: pointer;
      border-radius: 50%;
    }
    .card-icon-btn.fav-active {
      color: var(--accent-red);
    }

    /* Video Player Box */
    #video-stage {
      display: none;
      margin-bottom: 14px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    #video-stage.active { display: block; }
    video {
      width: 100%;
      max-height: 240px;
      display: block;
      background: #000;
    }
    .video-stage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #111;
      color: #fff;
      font-size: 12px;
    }
    .pip-btn {
      background: rgba(255,255,255,0.16);
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* E-Book Reader Card */
    .ebook-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-md);
      margin-bottom: 14px;
    }
    .ebook-controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-red {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-blue {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .lang-select {
      flex: 1;
      min-width: 140px;
      padding: 7px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }
    .reader-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      max-height: 360px;
      overflow-y: auto;
      line-height: 1.65;
    }
    .para-block {
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 3px solid transparent;
      transition: background 0.2s;
    }
    .para-block.active-read {
      background: var(--highlight-bg);
      border-left-color: var(--accent-red);
    }
    .para-orig {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .para-trans {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* YOUTUBE PROFILE / LIBRARY VIEW */
    .profile-header-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 0 14px;
    }
    .profile-avatar-lg {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #c84b31;
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .profile-meta-info h2 {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
    }
    .profile-meta-info p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }
    .profile-quick-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 16px;
      scrollbar-width: none;
    }
    .profile-quick-pills::-webkit-scrollbar { display: none; }

    .yt-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 12px;
    }
    .yt-section-title {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .yt-clear-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
    }

    .history-carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 14px;
      margin-bottom: 18px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .history-carousel::-webkit-scrollbar { display: none; }
    .history-card {
      width: 146px;
      flex-shrink: 0;
      scroll-snap-align: start;
      cursor: pointer;
    }
    .history-thumb {
      width: 146px;
      height: 82px;
      border-radius: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .history-thumb-icon {
      font-size: 26px;
    }
    .history-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .history-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--accent-red);
      width: 65%;
    }
    .history-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text-primary);
    }
    .history-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .library-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .library-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 4px 0;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .library-row:active {
      background: var(--bg-secondary);
    }
    .library-stack-thumb {
      width: 124px;
      height: 72px;
      border-radius: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      margin-top: 6px;
    }
    .library-stack-thumb::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 8px;
      right: 8px;
      height: 5px;
      background: var(--border-color);
      border-radius: 6px 6px 0 0;
      opacity: 0.7;
    }
    .library-stack-thumb::after {
      content: "";
      position: absolute;
      top: -9px;
      left: 16px;
      right: 16px;
      height: 4px;
      background: var(--border-color);
      border-radius: 6px 6px 0 0;
      opacity: 0.4;
    }
    .library-count-pill {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .library-row-info {
      flex: 1;
      min-width: 0;
    }
    .library-row-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .library-row-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .playlist-detail-box {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }
    .playlist-detail-box.open {
      display: block;
    }

    /* Mini Player Bar */
    .mini-player {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: calc(100% - 24px);
      max-width: calc(var(--app-max-w) - 24px);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: var(--shadow-md);
      z-index: 90;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease, background-color 0.25s ease, border-color 0.25s ease;
      will-change: transform, opacity;
    }
    .mini-player.chrome-hidden {
      transform: translateX(-50%) translateY(180px);
      opacity: 0;
      pointer-events: none;
    }
    .mp-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .mp-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .speed-pills {
      display: flex;
      gap: 3px;
      background: var(--bg-secondary);
      padding: 3px;
      border-radius: 14px;
    }
    .spd-btn {
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 11px;
      cursor: pointer;
    }
    .spd-btn.active {
      background: var(--accent-red);
      color: #fff;
    }
    .mp-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }
    .play-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--text-primary);
      color: var(--bg-primary);
      border: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .seek-bar {
      flex: 1;
      accent-color: var(--accent-red);
      height: 4px;
      cursor: pointer;
    }
    .time-label {
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* Floating Capsule Navigation Dock */
    .nav-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: calc(100% - 48px);
      max-width: calc(var(--app-max-w) - 48px);
      height: 54px;
      background: var(--dock-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--dock-border);
      border-radius: 30px;
      box-shadow: var(--shadow-dock);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 95;
      padding: 0 12px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
      will-change: transform, opacity;
    }
    .nav-dock.chrome-hidden {
      transform: translateX(-50%) translateY(120px);
      opacity: 0;
      pointer-events: none;
    }
    .dock-item {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 20px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }
    .dock-item.active-dock {
      background: var(--accent-red-soft);
    }
    .dock-item:active { transform: scale(0.9); }
    .dock-profile {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #c84b31;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
    }
    .dock-item.active-dock .dock-profile {
      border-color: var(--text-primary);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--app-max-w);
      background: rgba(0,0,0,0.55);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      width: 100%;
      padding: 18px;
      box-shadow: var(--shadow-md);
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .modal-input, .modal-textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .modal-textarea { height: 140px; resize: vertical; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .theme-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .theme-option {
      padding: 12px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .theme-option.active {
      border-color: var(--accent-blue);
      background: var(--accent-blue-soft);
    }

    .section-view { display: none; }
    .section-view.active { display: block; }
    .empty-hint {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- PIN Lock Screen -->

    <div class="pin-dots" id="pin-dots">

    </div>
    <div class="search-drawer" id="search-drawer">

  <!-- Main Content -->
  <main class="container">

    <!-- VIDEO TAB -->
    <section id="view-video" class="section-view active">

      <div class="media-list" id="list-ebook"></div>

    <!-- YOUTUBE-STYLE PROFILE / LIBRARY TAB -->

      <div class="profile-header-card">

  <!-- URL Import Modal -->

  <!-- Settings & Theme Modal -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-card">
      <div class="modal-title">🎨 外觀模式與安全設定</div>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">選擇介面主題模式：</p>
      <div class="theme-selector">
        <button class="theme-option" id="opt-light" onclick="setTheme('light')">☀️ 淺色模式</button>
        <button class="theme-option" id="opt-dark" onclick="setTheme('dark')">🌙 深色模式</button>
      </div>
      <hr style="border:none;border-top:1px solid var(--border-color);margin:14px 0;" />
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">隱私 PIN 碼鎖定（留空代表關閉）：</p>
      <input type="password" maxlength="4" pattern="[0-9]*" inputmode="numeric" class="modal-input" id="pin-setup-input" placeholder="設定 4 位數字 PIN 碼" />
      <div class="modal-footer">
        <button class="pill-btn" onclick="closeModals()">關閉</button>
        <button class="btn-red" onclick="savePinSetting()">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // YouTube-style Auto-Hide Header & Bottom Bars on Scroll
    let lastScrollY = window.scrollY;
    let lastReaderScrollTop = 0;
    const headerEl = document.getElementById('app-header');
    const miniPlayerEl = document.getElementById('mini-player');
    const navDockEl = document.getElementById('nav-dock');
    const readerBoxEl = document.getElementById('reader-box');

    function setChromeHidden(hidden) {
      headerEl.classList.toggle('chrome-hidden', hidden);
      miniPlayerEl.classList.toggle('chrome-hidden', hidden);
      navDockEl.classList.toggle('chrome-hidden', hidden);
    }

    window.addEventListener('scroll', () => {
      const currentY = window.scrollY;
      if (currentY <= 25) {
        setChromeHidden(false);
        lastScrollY = currentY;
        return;
      }
      if (currentY - lastScrollY > 10) {
        setChromeHidden(true);
        lastScrollY = currentY;
      } else if (lastScrollY - currentY > 10) {
        setChromeHidden(false);
        lastScrollY = currentY;
      }
    }, { passive: true });

    readerBoxEl.addEventListener('scroll', () => {
      const st = readerBoxEl.scrollTop;
      if (st <= 10) {
        setChromeHidden(false);
        lastReaderScrollTop = st;
        return;
      }
      if (st - lastReaderScrollTop > 12) {
        setChromeHidden(true);
        lastReaderScrollTop = st;
      } else if (lastReaderScrollTop - st > 12) {
        setChromeHidden(false);
        lastReaderScrollTop = st;
      }
    }, { passive: true });

    // Desktop Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        toggleGlobalPlay();
      } else if (e.code === 'ArrowRight') {
        const p = getActivePlayer();
        if (p && p.duration) p.currentTime = Math.min(p.duration, p.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        const p = getActivePlayer();
        if (p && p.duration) p.currentTime = Math.max(0, p.currentTime - 5);
      }
    });

    // Theme Management
    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.body.classList.toggle('dark-mode', isDark);
      document.getElementById('theme-toggle-btn').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('meta-theme-color').setAttribute('content', isDark ? '#0f1115' : '#ffffff');
      document.getElementById('opt-light').classList.toggle('active', !isDark);
      document.getElementById('opt-dark').classList.toggle('active', isDark);
      localStorage.setItem('mytube_theme', theme);
    }
    function setTheme(theme) { applyTheme(theme); }
    function toggleTheme() {
      applyTheme(document.body.classList.contains('dark-mode') ? 'light' : 'dark');
    }
    const savedTheme = localStorage.getItem('mytube_theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    // PIN Lock Logic
    let enteredPin = '';
    const storedPin = localStorage.getItem('mytube_pin') || '';
    if (storedPin && storedPin.length === 4) {
      document.getElementById('pin-screen').classList.remove('hidden');
    }
    function pressPin(num) {
      if (enteredPin.length >= 4) return;
      enteredPin += num;
      updatePinDots();
      if (enteredPin.length === 4) {
        if (enteredPin === storedPin) {
          document.getElementById('pin-screen').classList.add('hidden');
        } else {
          document.getElementById('pin-msg').textContent = '密碼錯誤，請重試';
          setTimeout(() => { enteredPin = ''; updatePinDots(); }, 400);
        }
      }
    }
    function clearPin() { enteredPin = ''; updatePinDots(); }
    function delPin() { enteredPin = enteredPin.slice(0, -1); updatePinDots(); }
    function updatePinDots() {
      document.querySelectorAll('.pin-dot').forEach((d, i) => d.classList.toggle('filled', i < enteredPin.length));
    }
    function savePinSetting() {
      const val = document.getElementById('pin-setup-input').value.trim();
      if (val === '') {
        localStorage.removeItem('mytube_pin');
        alert('已關閉 PIN 碼鎖定');
      } else if (/^\d{4}$/.test(val)) {
        localStorage.setItem('mytube_pin', val);
        alert('已設定 PIN 碼：' + val);
      } else {
        alert('請輸入 4 位數字！');
        return;
      }
      closeModals();
    }

    // IndexedDB Setup
    let db;
    const DB_NAME = 'MyTubeOfflineDB';
    const STORE_NAME = 'media_items';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains(STORE_NAME)) {
            d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    function addItemToDB(item) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const req = tx.objectStore(STORE_NAME).add(item);
        req.onsuccess = () => resolve(req.result);
      });
    }

      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);

    // Filter & import all matching video or audio files from a selected folder (e.g., MYTUBE/MP4 or MYTUBE/MP3 or Downloads)
    async function handleFolderBatchFiles(fileList, category) {
      if (!fileList || fileList.length === 0) return;
      const videoExts = ['mp4', 'm4v', 'mov', 'webm', 'mkv', 'avi'];
      const audioExts = ['mp3', 'm4a', 'aac', 'wav', 'ogg', 'flac'];
      const targetExts = category === 'video' ? videoExts : audioExts;

      const matchedFiles = Array.from(fileList).filter(f => {
        if (f.name.startsWith('.')) return false; // skip hidden macOS ._ files
        const ext = (f.name.split('.').pop() || '').toLowerCase();
        if (targetExts.includes(ext)) return true;
        if (category === 'video' && f.type && f.type.startsWith('video/')) return true;
        if (category === 'music' && f.type && f.type.startsWith('audio/')) return true;
        return false;
      });

      const inputEl = document.getElementById(category === 'video' ? 'folder-mp4' : 'folder-mp3');
      if (inputEl) inputEl.value = '';

      if (matchedFiles.length === 0) {
        alert(`在選取的資料夾中沒有找到${category === 'video' ? '影片' : '音樂'}檔案！`);
        return;
      }

      await handleMediaFiles(matchedFiles, category);
    }

    function getNormalizedBlob(file, category) {
      if (file.type && file.type !== 'application/octet-stream') return file;
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      const mimeMap = {
        mp4: 'video/mp4',
        m4v: 'video/mp4',
        mov: 'video/quicktime',
        webm: 'video/webm',
        mkv: 'video/x-matroska',
        avi: 'video/x-msvideo',
        mp3: 'audio/mpeg',
        m4a: 'audio/mp4',
        aac: 'audio/aac',
        wav: 'audio/wav',
        ogg: 'audio/ogg',
        flac: 'audio/flac'
      };
      const fallback = category === 'video' ? 'video/mp4' : 'audio/mpeg';
      const mime = mimeMap[ext] || fallback;
      return new Blob([file], { type: mime });
    }

    // Handle Local MP4 / MP3 Upload (Supports deduplication by filename + size when batch importing folders)
    async function handleMediaFiles(files, category) {
      if (!files || files.length === 0) return;
      const existingItems = await getAllFromDB();
      const existingKeys = new Set(
        existingItems
          .filter(it => it.category === category && it.type === 'file')
          .map(it => `${it.title}_${it.fileSize || 0}`)
      );

      let addedCount = 0;
      let skippedCount = 0;
      const fileArray = Array.from(files);

      for (let i = 0; i < fileArray.length; i++) {
        const file = fileArray[i];
        if (file.name.startsWith('.')) continue;
        const key = `${file.name}_${file.size}`;
        if (existingKeys.has(key)) {
          skippedCount++;
          continue;
        }
        showImportToast(`⏳ 正在載入 (${i + 1}/${fileArray.length})：${file.name}`);
        const cleanBlob = getNormalizedBlob(file, category);
        await addItemToDB({
          category,
          title: file.name,
          fileSize: file.size,
          type: 'file',
          blob: cleanBlob,
          createdAt: Date.now()
        });
        existingKeys.add(key);
        addedCount++;
      }

      const inputEl = document.getElementById(category === 'video' ? 'file-mp4' : 'file-mp3');
      if (inputEl) inputEl.value = '';

      await refreshData();

      if (addedCount > 0 && skippedCount > 0) {
        showImportToast(`✅ 已成功載入 ${addedCount} 個新檔案（略過 ${skippedCount} 個已存在檔案）`, 4000);
      } else if (addedCount > 0) {
        showImportToast(`✅ 已成功載入全部 ${addedCount} 個${category === 'video' ? '影片' : '音樂'}檔案！`, 3500);
      } else if (skippedCount > 0) {
        showImportToast(`ℹ️ 所選的 ${skippedCount} 個檔案都已經在清單裡囉！`, 3500);
      }
    }

    // Handle Local PDF / Word / TXT Ebook Upload
    async function handleEbookFile(file) {
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      let text = '';
      try {
        if (ext === 'txt' || ext === 'md') {
          text = await file.text();
        } else if (ext === 'docx' && window.mammoth) {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          text = result.value;
        } else if (ext === 'pdf' && window.pdfjsLib) {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(it => it.str).join(' ') + '

';
          }
        }
        if (text.trim()) {
          await saveAndLoadEbook(file.name, text);
        } else {
          alert('無法從檔案中擷取文字，請確認檔案未加密。');
        }
      } catch (err) {
        alert('解析檔案時發生錯誤：' + err.message);
      }
      document.getElementById('file-ebook').value = '';
    }

          const doc = new DOMParser().parseFromString(data.contents, 'text/html');
          doc.querySelectorAll('script,style,nav,header,footer').forEach(el => el.remove());
          const extracted = doc.body.innerText || '';
          const pageTitle = title || doc.title || url;
          await saveAndLoadEbook(pageTitle, extracted);
        } catch (e) {
          alert('抓取網頁文字失敗，建議直接複製文章內容使用「📝 貼上文字」。');

        createdAt: Date.now()
      });
      closeModals();
      await refreshData();
    }

    // CROSS-PLATFORM MEDIA PLAYBACK
    const videoEl = document.getElementById('main-video');
    const audioEl = document.getElementById('main-audio');

    function setupMediaSession(title, category) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: 'MyTube',
          album: category === 'video' ? '影片模式' : '聲音模式'
        });
        try {
          navigator.mediaSession.setActionHandler('play', () => {
            const p = getActivePlayer();
            if (p) { p.play(); updatePlayIcon(true); }
          });
          navigator.mediaSession.setActionHandler('pause', () => {
            const p = getActivePlayer();
            if (p) { p.pause(); updatePlayIcon(false); }
          });
          navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
          navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
        } catch (e) {}
      }
    }

    async function togglePictureInPicture() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (videoEl.requestPictureInPicture) {
          await videoEl.requestPictureInPicture();
        } else if (videoEl.webkitSetPresentationMode) {
          videoEl.webkitSetPresentationMode(
            videoEl.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture'
          );
        }
      } catch (err) {
        alert('目前瀏覽器不支援子母畫面或影片尚未開始播放');
      }
    }

    async function playItem(id) {
      const item = allItems.find(it => it.id === id);
      if (!item) return;

      if (isSpeaking && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        document.getElementById('tts-btn').textContent = '🔊 播放朗讀';
      }

      recordHistory({
        uid: 'item_' + item.id,
        itemId: item.id,
        category: item.category,
        title: item.title
      });

      if (item.category === 'ebook') {
        currentEbook = { title: item.title, paragraphs: item.paragraphs, translations: [] };
        renderEbookReader();
        document.getElementById('mp-title').textContent = '📖 ' + item.title;
        if (currentTab !== 'ebook') switchTab('ebook');
        return;
      }

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      currentTrack = item;
      let src = '';
      if (item.type === 'file') {
        const cleanBlob = getNormalizedBlob(item.blob, item.category);
        currentObjectUrl = URL.createObjectURL(cleanBlob);
        src = currentObjectUrl;
      } else {
        src = item.url;
      }

      document.getElementById('mp-title').textContent = (item.category === 'video' ? '🎬 ' : '🎵 ') + item.title;
      setupMediaSession(item.title, item.category);

      if (item.category === 'video') {
        audioEl.pause();
        audioEl.removeAttribute('src');
        if (currentTab !== 'video') switchTab('video');
        document.getElementById('video-stage').classList.add('active');
        document.getElementById('video-stage-label').textContent = '🎬 ' + item.title;
        videoEl.src = src;
        videoEl.load();
        videoEl.playbackRate = playbackRate;
        try {
          await videoEl.play();
          updatePlayIcon(true);
        } catch (err) {
          updatePlayIcon(false);
        }
      } else {
        videoEl.pause();
        videoEl.removeAttribute('src');
        document.getElementById('video-stage').classList.remove('active');
        audioEl.src = src;
        audioEl.load();
        audioEl.playbackRate = playbackRate;
        try {
          await audioEl.play();
          updatePlayIcon(true);
        } catch (err) {
          updatePlayIcon(false);
        }
      }
      renderAll();
    }

    function getActivePlayer() {
      if (!currentTrack) return null;
      return currentTrack.category === 'video' ? videoEl : audioEl;
    }

    async function toggleGlobalPlay() {
      if (currentTab === 'ebook' && !currentTrack) {
        toggleTTS();
        return;
      }
      const player = getActivePlayer();
      if (!player) return;
      if (player.paused) {
        try {
          await player.play();
          updatePlayIcon(true);
        } catch (e) {}
      } else {
        player.pause();
        updatePlayIcon(false);
      }
    }

    function updatePlayIcon(isPlaying) {
      document.getElementById('mp-play-btn').textContent = isPlaying ? '⏸' : '▶';
    }

    function setSpeed(rate, btn) {
      playbackRate = rate;
      document.querySelectorAll('.spd-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      videoEl.playbackRate = rate;
      audioEl.playbackRate = rate;
    }

    function seekMedia(val) {
      const player = getActivePlayer();
      if (player && player.duration && isFinite(player.duration)) {
        player.currentTime = (val / 100) * player.duration;
      }
    }

    function prevTrack() {
      if (!currentTrack) return;
      const list = allItems.filter(it => it.category === currentTrack.category);
      const idx = list.findIndex(it => it.id === currentTrack.id);
      if (idx > 0) playItem(list[idx - 1].id);
    }

    function nextTrack() {
      if (!currentTrack) return;
      const list = allItems.filter(it => it.category === currentTrack.category);
      const idx = list.findIndex(it => it.id === currentTrack.id);
      if (idx >= 0 && idx < list.length - 1) playItem(list[idx + 1].id);
    }

    [videoEl, audioEl].forEach(el => {
      el.addEventListener('play', () => updatePlayIcon(true));
      el.addEventListener('pause', () => updatePlayIcon(false));
      el.addEventListener('timeupdate', () => {
        if (!el.duration || !isFinite(el.duration)) return;
        document.getElementById('seek-bar').value = (el.currentTime / el.duration) * 100;
        document.getElementById('time-label').textContent = `${fmtTime(el.currentTime)} / ${fmtTime(el.duration)}`;
      });
      el.addEventListener('ended', () => {
        updatePlayIcon(false);
        nextTrack();
      });
      el.addEventListener('error', () => {
        updatePlayIcon(false);
        alert('此檔案編碼格式（例如部分 H.265/MKV）不受目前瀏覽器支援，建議轉為標準 MP4 (H.264) 或 MP3 / M4A 格式。');
      });
    });

    function fmtTime(sec) {
      if (!sec || !isFinite(sec)) return '00:00';
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // E-Book Reader, Translation & TTS
    function renderEbookReader(activeIdx = -1) {
      const box = document.getElementById('reader-box');
      document.getElementById('mp-title').textContent = '📖 ' + currentEbook.title;
      box.innerHTML = currentEbook.paragraphs.map((p, idx) => `
        <div class="para-block ${idx === activeIdx ? 'active-read' : ''}" id="para-${idx}">
          <div class="para-orig">${escapeHtml(p)}</div>
          ${currentEbook.translations[idx] ? `<div class="para-trans">${escapeHtml(currentEbook.translations[idx])}</div>` : ''}
        </div>
      `).join('');
    }

    async function translateEbook(mode) {
      const targetLang = document.getElementById('target-lang').value;
      const translatedList = [];
      for (let i = 0; i < currentEbook.paragraphs.length; i++) {
        const text = currentEbook.paragraphs[i];
        try {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
          const res = await fetch(url);
          const data = await res.json();
          const resultText = data[0].map(item => item[0]).join('');
          translatedList.push(resultText);
        } catch (e) {
          translatedList.push('[翻譯連線失敗]');
        }
      }
      if (mode === 'replace') {
        currentEbook.paragraphs = translatedList;
        currentEbook.translations = [];
      } else {
        currentEbook.translations = translatedList;
      }
      renderEbookReader();
    }

    let isSpeaking = false;
    let ttsIndex = 0;
    let currentUtterance = null;

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function toggleTTS() {
      if (!('speechSynthesis' in window)) return alert('此瀏覽器不支援語音朗讀');
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        currentUtterance = null;
        document.getElementById('tts-btn').textContent = '🔊 播放朗讀';
        updatePlayIcon(false);
        return;
      }
      window.speechSynthesis.cancel();
      isSpeaking = true;
      ttsIndex = 0;
      document.getElementById('tts-btn').textContent = '⏹ 停止朗讀';
      updatePlayIcon(true);
      speakNextParagraph();
    }

    function speakNextParagraph() {
      if (!isSpeaking || ttsIndex >= currentEbook.paragraphs.length) {
        isSpeaking = false;
        currentUtterance = null;
        document.getElementById('tts-btn').textContent = '🔊 播放朗讀';
        updatePlayIcon(false);
        renderEbookReader(-1);
        return;
      }
      renderEbookReader(ttsIndex);
      const activeEl = document.getElementById('para-' + ttsIndex);
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      const textToRead = currentEbook.paragraphs[ttsIndex];
      currentUtterance = new SpeechSynthesisUtterance(textToRead);
      currentUtterance.rate = playbackRate;

      const hasChinese = /[一-龥]/.test(textToRead);
      currentUtterance.lang = hasChinese ? 'zh-TW' : document.getElementById('target-lang').value;

      currentUtterance.onend = () => {
        if (!isSpeaking) return;
        ttsIndex++;
        speakNextParagraph();
      };
      currentUtterance.onerror = () => {
        if (!isSpeaking) return;
        ttsIndex++;
        speakNextParagraph();
      };
      window.speechSynthesis.speak(currentUtterance);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    // Boot
    renderEbookReader();
    initDB().then(refreshData);
  </script>
</body>
</html>
