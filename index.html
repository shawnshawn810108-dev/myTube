<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>MyTube</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1c1c1e;
      --surface-hover: #2c2c2e;
      --border: #333336;
      --text: #f5f5f7;
      --text-sub: #98989d;
      --accent: #ff2d55;
      --accent-soft: rgba(255, 45, 85, 0.16);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部導覽列 */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 15, 15, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: inherit;
      border: none;
      outline: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease, background-color 0.15s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-icon {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* 播放器區塊 */
    .player-section {
      background: #000;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 16px;
      display: none;
    }

    .player-section.active {
      display: block;
    }

    .media-wrapper {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #141414;
      position: relative;
    }

    video {
      width: 100%;
      max-height: 42vh;
      display: block;
      background: #000;
    }

    .audio-cover {
      display: none;
      padding: 28px 20px;
      text-align: center;
      background: linear-gradient(145deg, #24141b, #161618);
    }

    .audio-cover.active {
      display: block;
    }

    .audio-disc {
      width: 68px;
      height: 68px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: var(--accent-soft);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    audio {
      width: 100%;
      margin-top: 12px;
      height: 40px;
    }

    .now-playing-bar {
      max-width: 720px;
      margin: 10px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .now-playing-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .player-controls {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* 主內容區 */
    main {
      flex: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 16px 90px;
    }

    /* 分頁切換：僅保留 影片 / 音樂 */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .tab-btn {
      background: transparent;
      color: var(--text-sub);
      padding: 10px 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* 播放清單列 */
    .playlist-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .playlist-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--surface);
      color: var(--text-sub);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chip.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;
    }

    /* 搜尋列 */
    .search-box {
      margin-bottom: 14px;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* 檔案列表 */
    .media-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .media-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .media-item.playing {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .media-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .media-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .media-meta {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      color: var(--text);
    }

    .item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-mini {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-mini.danger {
      color: #ff6961;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-sub);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      margin-top: 8px;
    }

    .empty-state p {
      margin: 6px 0 16px;
      font-size: 14px;
    }

    /* 彈窗 Modal（關閉時徹底隱藏，絕不擋住點擊） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      padding: 22px;
      text-align: center;
    }

    .modal-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .modal-card p {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .modal-card input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 16px;
      text-align: center;
      margin-bottom: 14px;
      outline: none;
      user-select: text;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }

    /* 狀態提示 Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c2c2e;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      z-index: 200;
      display: none;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="brand">
      <span class="brand-icon">▶</span>
      <span>MyTube</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-icon" id="btnPinSetting">🔒 密碼鎖</button>
      <button type="button" class="btn-primary" id="btnImportTrigger">＋ 匯入檔案</button>
      <input type="file" id="fileInput" accept="video/*,audio/*,.mp4,.mp3,.m4a,.mov,.wav,.aac,.webm" multiple style="display:none;" />
    </div>
  </header>

  <!-- 播放器區域 -->
  <section class="player-section" id="playerSection">
    <div class="media-wrapper">
      <video id="videoPlayer" controls playsinline webkit-playsinline></video>
      <div class="audio-cover" id="audioCover">
        <div class="audio-disc">🎵</div>
        <div id="audioCoverTitle" style="font-weight:600; font-size:15px;">正在播放音樂</div>
        <audio id="audioPlayer" controls playsinline></audio>
      </div>
    </div>
    <div class="now-playing-bar">
      <div class="now-playing-title" id="nowPlayingTitle">未選擇檔案</div>
      <div class="player-controls">
        <button type="button" class="btn-mini" id="btnPrev">⏮ 上一首</button>
        <button type="button" class="btn-mini" id="btnNext">下一首 ⏭</button>
        <button type="button" class="btn-mini" id="btnLoop">🔁 循環:關</button>
        <button type="button" class="btn-mini" id="btnClosePlayer">✕</button>
      </div>
    </div>
  </section>

  <!-- 主介面 -->
  <main>
    <!-- 分頁切換（僅保留 影片 與 音樂） -->
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabVideo" data-tab="video">🎬 影片</button>
      <button type="button" class="tab-btn" id="tabAudio" data-tab="audio">🎵 音樂</button>
    </div>

    <!-- 播放清單列 -->
    <div class="playlist-bar" id="playlistBar"></div>

    <!-- 搜尋列 -->
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="搜尋檔案名稱..." />
    </div>

    <!-- 媒體列表 -->
    <div class="media-list" id="mediaList"></div>
  </main>

  <!-- PIN 碼解鎖 / 設定視窗 -->
  <div class="modal-backdrop" id="pinModal">
    <div class="modal-card">
      <h3 id="pinModalTitle">輸入 PIN 碼</h3>
      <p id="pinModalDesc">請輸入 4 位數密碼以解鎖 MyTube</p>
      <input type="password" id="pinInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="••••" />
      <div class="modal-actions">
        <button type="button" class="btn-icon" id="btnPinCancel">取消</button>
        <button type="button" class="btn-primary" id="btnPinConfirm">確認</button>
      </div>
    </div>
  </div>

  <!-- 新增播放清單視窗 -->
  <div class="modal-backdrop" id="playlistModal">
    <div class="modal-card">
      <h3>新增播放清單</h3>
      <p>輸入新的清單名稱（例如：運動歌單、電影收藏）</p>
      <input type="text" id="playlistNameInput" placeholder="請輸入名稱" />
      <div class="modal-actions">
        <button type="button" class="btn-icon" id="btnPlCancel">取消</button>
        <button type="button" class="btn-primary" id="btnPlConfirm">建立</button>
      </div>
    </div>
  </div>

  <!-- 加入清單選擇視窗 -->
  <div class="modal-backdrop" id="assignModal">
    <div class="modal-card">
      <h3>加入播放清單</h3>
      <p id="assignFileName">選擇要歸類的清單</p>
      <div id="assignListOptions" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-icon" id="btnAssignCancel">關閉</button>
      </div>
    </div>
  </div>

  <!-- 提示訊息 -->
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      // 全新獨立資料庫名稱，避免舊版殘留衝突
      const DB_NAME = "MyTube_Standalone_DB_v2";
      const DB_VERSION = 1;
      const STORE_NAME = "media_files";

      let db = null;
      let allItems = [];
      let currentTab = "video"; // "video" 或 "audio"
      let currentPlaylist = "ALL";
      let searchQuery = "";
      let currentPlayingId = null;
      let currentObjectUrl = null;
      let isLoopOne = false;
      let pinMode = "unlock"; // "unlock" | "set" | "remove"
      let pendingAssignId = null;

      // DOM 元素參照
      const el = {
        btnImportTrigger: document.getElementById("btnImportTrigger"),
        fileInput: document.getElementById("fileInput"),
        btnPinSetting: document.getElementById("btnPinSetting"),
        tabVideo: document.getElementById("tabVideo"),
        tabAudio: document.getElementById("tabAudio"),
        playlistBar: document.getElementById("playlistBar"),
        searchInput: document.getElementById("searchInput"),
        mediaList: document.getElementById("mediaList"),
        playerSection: document.getElementById("playerSection"),
        videoPlayer: document.getElementById("videoPlayer"),
        audioCover: document.getElementById("audioCover"),
        audioCoverTitle: document.getElementById("audioCoverTitle"),
        audioPlayer: document.getElementById("audioPlayer"),
        nowPlayingTitle: document.getElementById("nowPlayingTitle"),
        btnPrev: document.getElementById("btnPrev"),
        btnNext: document.getElementById("btnNext"),
        btnLoop: document.getElementById("btnLoop"),
        btnClosePlayer: document.getElementById("btnClosePlayer"),
        pinModal: document.getElementById("pinModal"),
        pinModalTitle: document.getElementById("pinModalTitle"),
        pinModalDesc: document.getElementById("pinModalDesc"),
        pinInput: document.getElementById("pinInput"),
        btnPinCancel: document.getElementById("btnPinCancel"),
        btnPinConfirm: document.getElementById("btnPinConfirm"),
        playlistModal: document.getElementById("playlistModal"),
        playlistNameInput: document.getElementById("playlistNameInput"),
        btnPlCancel: document.getElementById("btnPlCancel"),
        btnPlConfirm: document.getElementById("btnPlConfirm"),
        assignModal: document.getElementById("assignModal"),
        assignFileName: document.getElementById("assignFileName"),
        assignListOptions: document.getElementById("assignListOptions"),
        btnAssignCancel: document.getElementById("btnAssignCancel"),
        toast: document.getElementById("toast")
      };

      function showToast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add("show");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          el.toast.classList.remove("show");
        }, 2400);
      }

      // 播放清單管理 (存於 localStorage)
      function getPlaylists() {
        try {
          const raw = localStorage.getItem("mytube_playlists_v2");
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function savePlaylists(list) {
        localStorage.setItem("mytube_playlists_v2", JSON.stringify(list));
      }

      // 初始化 IndexedDB
      function initDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              database.createObjectStore(STORE_NAME, { keyPath: "id" });
            }
          };
          req.onsuccess = (e) => {
            db = e.target.result;
            resolve(db);
          };
          req.onerror = (e) => {
            reject(e.target.error);
          };
        });
      }

      function loadAllMedia() {
        return new Promise((resolve, reject) => {
          if (!db) return resolve([]);
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => {
            allItems = (req.result || []).sort((a, b) => b.createdAt - a.createdAt);
            resolve(allItems);
          };
          req.onerror = () => reject(req.error);
        });
      }

      function saveMediaRecord(record) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          const store = tx.objectStore(STORE_NAME);
          const req = store.put(record);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      function deleteMediaRecord(id) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          const store = tx.objectStore(STORE_NAME);
          const req = store.delete(id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      // 判斷檔案屬於影片或音樂
      function detectMediaCategory(file) {
        const name = (file.name || "").toLowerCase();
        const type = (file.type || "").toLowerCase();
        if (type.startsWith("audio/") || /\.(mp3|m4a|wav|aac|flac|ogg)$/.test(name)) {
          return "audio";
        }
        return "video";
      }

      function formatSize(bytes) {
        if (!bytes) return "0 MB";
        const mb = bytes / (1024 * 1024);
        return mb >= 1 ? mb.toFixed(1) + " MB" : Math.round(bytes / 1024) + " KB";
      }

      // 匯入檔案處理
      async function handleFilesSelected(files) {
        if (!files || files.length === 0) return;
        showToast("正在匯入 " + files.length + " 個檔案...");
        let importedCount = 0;
        let lastCategory = currentTab;

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const category = detectMediaCategory(file);
          lastCategory = category;

          const record = {
            id: "media_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
            name: file.name,
            category: category, // "video" -> MYTUBE/MP4, "audio" -> MYTUBE/MP3
            folder: category === "video" ? "MYTUBE/MP4" : "MYTUBE/MP3",
            mimeType: file.type || (category === "video" ? "video/mp4" : "audio/mpeg"),
            size: file.size,
            playlist: currentPlaylist !== "ALL" ? currentPlaylist : "",
            blob: file,
            createdAt: Date.now() + i
          };

          try {
            await saveMediaRecord(record);
            importedCount++;
          } catch (err) {
            console.error("儲存失敗:", err);
            showToast("匯入失敗，可能是手機儲存空間不足");
          }
        }

        el.fileInput.value = "";
        await loadAllMedia();

        if (importedCount > 0) {
          switchTab(lastCategory);
          showToast("成功匯入 " + importedCount + " 個檔案！");
        }
      }

      // 切換分頁（影片 / 音樂）
      function switchTab(tab) {
        currentTab = tab;
        el.tabVideo.classList.toggle("active", tab === "video");
        el.tabAudio.classList.toggle("active", tab === "audio");
        renderPlaylists();
        renderMediaList();
      }

      // 渲染播放清單列
      function renderPlaylists() {
        const playlists = getPlaylists();
        el.playlistBar.innerHTML = "";

        const allChip = document.createElement("button");
        allChip.type = "button";
        allChip.className = "chip" + (currentPlaylist === "ALL" ? " active" : "");
        allChip.textContent = currentTab === "video" ? "全部影片" : "全部音樂";
        allChip.onclick = () => {
          currentPlaylist = "ALL";
          renderPlaylists();
          renderMediaList();
        };
        el.playlistBar.appendChild(allChip);

        playlists.forEach((pl) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip" + (currentPlaylist === pl ? " active" : "");
          chip.textContent = pl;
          chip.onclick = () => {
            currentPlaylist = pl;
            renderPlaylists();
            renderMediaList();
          };
          el.playlistBar.appendChild(chip);
        });

        const addChip = document.createElement("button");
        addChip.type = "button";
        addChip.className = "chip";
        addChip.textContent = "＋ 新清單";
        addChip.onclick = () => {
          el.playlistNameInput.value = "";
          el.playlistModal.classList.add("open");
          el.playlistNameInput.focus();
        };
        el.playlistBar.appendChild(addChip);
      }

      // 取得目前篩選後的清單
      function getFilteredItems() {
        return allItems.filter((item) => {
          if (item.category !== currentTab) return false;
          if (currentPlaylist !== "ALL" && item.playlist !== currentPlaylist) return false;
          if (searchQuery && !item.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        });
      }

      // 渲染檔案列表
      function renderMediaList() {
        const items = getFilteredItems();
        el.mediaList.innerHTML = "";

        if (items.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const label = currentTab === "video" ? "影片 (MP4)" : "音樂 (MP3)";
          empty.innerHTML = `
            <div style="font-size:32px;">${currentTab === "video" ? "🎬" : "🎧"}</div>
            <p>目前沒有任何${label}檔案</p>
            <button type="button" class="btn-primary" id="btnEmptyImport">＋ 立即從手機選擇檔案</button>
          `;
          el.mediaList.appendChild(empty);
          const btnEmpty = document.getElementById("btnEmptyImport");
          if (btnEmpty) {
            btnEmpty.onclick = () => el.fileInput.click();
          }
          return;
        }

        items.forEach((item) => {
          const row = document.createElement("div");
          row.className = "media-item" + (item.id === currentPlayingId ? " playing" : "");

          const info = document.createElement("div");
          info.className = "media-info";
          info.onclick = () => playItem(item);

          const plTag = item.playlist ? `<span class="badge">${escapeHtml(item.playlist)}</span>` : "";
          info.innerHTML = `
            <div class="media-name">${escapeHtml(item.name)}</div>
            <div class="media-meta">
              <span class="badge">${item.folder || (item.category === "video" ? "MYTUBE/MP4" : "MYTUBE/MP3")}</span>
              <span>${formatSize(item.size)}</span>
              ${plTag}
            </div>
          `;

          const actions = document.createElement("div");
          actions.className = "item-actions";

          const btnAddPl = document.createElement("button");
          btnAddPl.type = "button";
          btnAddPl.className = "btn-mini";
          btnAddPl.textContent = "清單";
          btnAddPl.onclick = (e) => {
            e.stopPropagation();
            openAssignModal(item);
          };

          const btnDel = document.createElement("button");
          btnDel.type = "button";
          btnDel.className = "btn-mini danger";
          btnDel.textContent = "刪除";
          btnDel.onclick = async (e) => {
            e.stopPropagation();
            if (confirm("確定要刪除「" + item.name + "」嗎？")) {
              if (currentPlayingId === item.id) {
                stopAndClosePlayer();
              }
              await deleteMediaRecord(item.id);
              await loadAllMedia();
              renderMediaList();
              showToast("已刪除檔案");
            }
          };

          actions.appendChild(btnAddPl);
          actions.appendChild(btnDel);

          row.appendChild(info);
          row.appendChild(actions);
          el.mediaList.appendChild(row);
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // 播放媒體（支援 iPhone 背景播放）
      function playItem(item) {
        if (!item || !item.blob) return;

        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
        }
        currentObjectUrl = URL.createObjectURL(item.blob);
        currentPlayingId = item.id;

        el.playerSection.classList.add("active");
        el.nowPlayingTitle.textContent = item.name;

        // 停止另一組播放器
        el.videoPlayer.pause();
        el.audioPlayer.pause();

        if (item.category === "video") {
          el.audioCover.classList.remove("active");
          el.videoPlayer.style.display = "block";
          el.videoPlayer.src = currentObjectUrl;
          el.videoPlayer.loop = isLoopOne;
          el.videoPlayer.play().catch(() => {});
        } else {
          el.videoPlayer.style.display = "none";
          el.audioCover.classList.add("active");
          el.audioCoverTitle.textContent = item.name;
          el.audioPlayer.src = currentObjectUrl;
          el.audioPlayer.loop = isLoopOne;
          el.audioPlayer.play().catch(() => {});
        }

        // 設定 iOS 鎖定畫面控制 (Media Session)
        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: item.name,
            artist: "MyTube",
            album: item.playlist || (item.category === "video" ? "影片" : "音樂")
          });
          navigator.mediaSession.setActionHandler("previoustrack", () => playAdjacent(-1));
          navigator.mediaSession.setActionHandler("nexttrack", () => playAdjacent(1));
        }

        renderMediaList();
      }

      function playAdjacent(step) {
        const items = getFilteredItems();
        if (items.length === 0) return;
        const idx = items.findIndex((x) => x.id === currentPlayingId);
        const nextIdx = idx === -1 ? 0 : (idx + step + items.length) % items.length;
        playItem(items[nextIdx]);
      }

      function stopAndClosePlayer() {
        el.videoPlayer.pause();
        el.videoPlayer.removeAttribute("src");
        el.audioPlayer.pause();
        el.audioPlayer.removeAttribute("src");
        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
          currentObjectUrl = null;
        }
        currentPlayingId = null;
        el.playerSection.classList.remove("active");
        renderMediaList();
      }

      // 加入播放清單彈窗
      function openAssignModal(item) {
        pendingAssignId = item.id;
        el.assignFileName.textContent = "將「" + item.name + "」歸類至：";
        el.assignListOptions.innerHTML = "";

        const playlists = getPlaylists();
        const noneBtn = document.createElement("button");
        noneBtn.type = "button";
        noneBtn.className = "btn-icon";
        noneBtn.style.justifyContent = "center";
        noneBtn.textContent = "未分類（移出清單）";
        noneBtn.onclick = () => assignToPlaylist("");
        el.assignListOptions.appendChild(noneBtn);

        playlists.forEach((pl) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-icon";
          btn.style.justifyContent = "center";
          btn.textContent = pl;
          btn.onclick = () => assignToPlaylist(pl);
          el.assignListOptions.appendChild(btn);
        });

        el.assignModal.classList.add("open");
      }

      async function assignToPlaylist(plName) {
        const target = allItems.find((x) => x.id === pendingAssignId);
        if (target) {
          target.playlist = plName;
          await saveMediaRecord(target);
          await loadAllMedia();
          renderMediaList();
          showToast(plName ? "已加入「" + plName + "」" : "已移出播放清單");
        }
        el.assignModal.classList.remove("open");
        pendingAssignId = null;
      }

      // PIN 碼鎖定邏輯
      function updatePinButtonUI() {
        const savedPin = localStorage.getItem("mytube_pin_v2");
        el.btnPinSetting.textContent = savedPin ? "🔒 已上鎖" : "🔓 設定密碼";
      }

      function openPinModal(mode) {
        pinMode = mode;
        el.pinInput.value = "";
        if (mode === "unlock") {
          el.pinModalTitle.textContent = "MyTube 已鎖定";
          el.pinModalDesc.textContent = "請輸入 4 位數 PIN 碼進入";
          el.btnPinCancel.style.display = "none";
        } else if (mode === "set") {
          el.pinModalTitle.textContent = "設定 PIN 碼";
          el.pinModalDesc.textContent = "請輸入新的 4 位數密碼";
          el.btnPinCancel.style.display = "inline-flex";
        } else if (mode === "remove") {
          el.pinModalTitle.textContent = "解除密碼鎖";
          el.pinModalDesc.textContent = "輸入目前 PIN 碼以關閉密碼鎖";
          el.btnPinCancel.style.display = "inline-flex";
        }
        el.pinModal.classList.add("open");
        setTimeout(() => el.pinInput.focus(), 100);
      }

      function handlePinConfirm() {
        const val = el.pinInput.value.trim();
        const savedPin = localStorage.getItem("mytube_pin_v2");

        if (!/^\d{4}$/.test(val)) {
          showToast("請輸入 4 位數字");
          return;
        }

        if (pinMode === "unlock") {
          if (val === savedPin) {
            el.pinModal.classList.remove("open");
            showToast("解鎖成功");
          } else {
            showToast("密碼錯誤，請重試");
            el.pinInput.value = "";
          }
        } else if (pinMode === "set") {
          localStorage.setItem("mytube_pin_v2", val);
          el.pinModal.classList.remove("open");
          updatePinButtonUI();
          showToast("PIN 碼已設定完成");
        } else if (pinMode === "remove") {
          if (val === savedPin) {
            localStorage.removeItem("mytube_pin_v2");
            el.pinModal.classList.remove("open");
            updatePinButtonUI();
            showToast("已關閉密碼鎖");
          } else {
            showToast("密碼錯誤");
            el.pinInput.value = "";
          }
        }
      }

      // 綁定所有按鈕事件
      function bindEvents() {
        el.btnImportTrigger.addEventListener("click", () => {
          el.fileInput.click();
        });

        el.fileInput.addEventListener("change", (e) => {
          handleFilesSelected(e.target.files);
        });

        el.tabVideo.addEventListener("click", () => switchTab("video"));
        el.tabAudio.addEventListener("click", () => switchTab("audio"));

        el.searchInput.addEventListener("input", (e) => {
          searchQuery = e.target.value;
          renderMediaList();
        });

        el.btnPrev.addEventListener("click", () => playAdjacent(-1));
        el.btnNext.addEventListener("click", () => playAdjacent(1));

        el.btnLoop.addEventListener("click", () => {
          isLoopOne = !isLoopOne;
          el.videoPlayer.loop = isLoopOne;
          el.audioPlayer.loop = isLoopOne;
          el.btnLoop.textContent = isLoopOne ? "🔂 單曲循環" : "🔁 循環:關";
          showToast(isLoopOne ? "已開啟單曲循環" : "已關閉單曲循環");
        });

        el.btnClosePlayer.addEventListener("click", stopAndClosePlayer);

        // 自動播下一首
        el.videoPlayer.addEventListener("ended", () => {
          if (!isLoopOne) playAdjacent(1);
        });
        el.audioPlayer.addEventListener("ended", () => {
          if (!isLoopOne) playAdjacent(1);
        });

        // PIN 碼按鈕
        el.btnPinSetting.addEventListener("click", () => {
          const hasPin = !!localStorage.getItem("mytube_pin_v2");
          openPinModal(hasPin ? "remove" : "set");
        });
        el.btnPinCancel.addEventListener("click", () => {
          el.pinModal.classList.remove("open");
        });
        el.btnPinConfirm.addEventListener("click", handlePinConfirm);

        // 播放清單彈窗按鈕
        el.btnPlCancel.addEventListener("click", () => {
          el.playlistModal.classList.remove("open");
        });
        el.btnPlConfirm.addEventListener("click", () => {
          const name = el.playlistNameInput.value.trim();
          if (!name) {
            showToast("請輸入清單名稱");
            return;
          }
          const list = getPlaylists();
          if (!list.includes(name)) {
            list.push(name);
            savePlaylists(list);
          }
          currentPlaylist = name;
          el.playlistModal.classList.remove("open");
          renderPlaylists();
          renderMediaList();
          showToast("已建立清單「" + name + "」");
        });

        el.btnAssignCancel.addEventListener("click", () => {
          el.assignModal.classList.remove("open");
        });
      }

      // 啟動程式
      async function bootstrap() {
        bindEvents();
        updatePinButtonUI();

        const savedPin = localStorage.getItem("mytube_pin_v2");
        if (savedPin) {
          openPinModal("unlock");
        }

        try {
          await initDB();
          await loadAllMedia();
        } catch (err) {
          console.error("資料庫初始化失敗:", err);
          showToast("離線資料庫啟動異常，請關閉無痕模式重試");
        }

        renderPlaylists();
        renderMediaList();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
